<svg width="1000" height="330" viewBox="0 0 1000 330"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 58px;
      font-weight: 400;
      letter-spacing: 8px;
      fill: #151515;
    }

    .role {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 6px;
      fill: #777777;
    }

    .quote {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-style: italic;
      font-weight: 400;
      fill: #3f3f3f;
    }

    .line {
      stroke: #cfcfcf;
    }

    @media (prefers-color-scheme: dark) {
      .name {
        fill: #f3f3f3;
      }

      .role {
        fill: #999999;
      }

      .quote {
        fill: #cccccc;
      }

      .line {
        stroke: #555555;
      }
    }
  </style>

  <text
    x="500"
    y="105"
    text-anchor="middle"
    class="name">
    PARK YUNA
  </text>

  <text
    x="500"
    y="147"
    text-anchor="middle"
    class="role">
    FULLSTACK DEVELOPER
  </text>

  <line
    x1="380"
    y1="185"
    x2="620"
    y2="185"
    stroke-width="1"
    class="line"/>

  <text
    x="500"
    y="235"
    text-anchor="middle"
    class="quote">
    Building experiences that create real value for users.
  </text>

</svg>
